loomx.loom_version = "1.18-SNAPSHOT"

[mod]
id = "magicstorage"
name = "Modern Magic Storage"
group = "com.brilliafy"
version = "2.0.0"
channel_tag = ""
description = "A Terraria-inspired storage network mod for Minecraft — modern multi-loader edition supporting Fabric, NeoForge, and Forge."
authors = ["Brilliafy"]
contributors = []
inception_year = "2026"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
environment = "client_and_server"
sources_url = "https://github.com/Brilliafy/ModernMagicStorage"
homepage_url = "https://github.com/Brilliafy/ModernMagicStorage"
issues_url = "https://github.com/Brilliafy/ModernMagicStorage/issues"
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]

[[mod.pom.developers]]
id = "brilliafy"
name = "Brilliafy"
url = "https://github.com/Brilliafy"

