name: release

on:
  workflow_dispatch:
    inputs:
      publish_to_stores:
        description: 'Publish to Modrinth & CurseForge'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      MOD_IS_RELEASE: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r VERSION CHANNEL_TAG < <(python3 -c '
          import tomllib

          with open("stonecutter.properties.toml", "rb") as f:
              mod = tomllib.load(f).get("mod", {})

          print(mod.get("version", ""), mod.get("channel_tag", ""))
          ')
          FULL_VERSION="${VERSION}${CHANNEL_TAG}"

          if [[ -z "$FULL_VERSION" ]]; then
            echo "::error::Could not read [mod].version from stonecutter.properties.toml."
            exit 1
          fi

          RELEASE_TAG="v${FULL_VERSION}"
          echo "Release tag: $RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "✓ Version validated: $FULL_VERSION"

      - name: Prepare git-cliff
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          sed -i "s|%%%repo_url%%%|${REPO_URL}|g" cliff.toml

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output CHANGELOG.md
          version: 'v2.13.1'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
          PUB_GITHUB_ENABLE: ${{ vars.PUB_GITHUB_ENABLE || 'true' }}
          PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
          PUB_MODS_ENABLE: ${{ inputs.publish_to_stores }}
          PUB_MAVEN_ENABLE: ${{ vars.PUB_MAVEN_ENABLE }}
          PUB_MAVEN_CENTRAL_ENABLE: ${{ vars.PUB_MAVEN_CENTRAL_ENABLE }}
          PUB_MAVEN_CENTRAL_SNAPSHOTS: ${{ vars.PUB_MAVEN_CENTRAL_SNAPSHOTS }}
          PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
          PUB_MODRINTH_PROJECT_ID: ${{ vars.PUB_MODRINTH_PROJECT_ID }}
          PUB_CURSEFORGE_PROJECT_ID: ${{ vars.PUB_CURSEFORGE_PROJECT_ID }}
          PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
          PUB_CURSEFORGE_TOKEN: ${{ secrets.PUB_CURSEFORGE_TOKEN }}
          PUB_SIGNING_KEY: ${{ secrets.PUB_SIGNING_KEY }}
          PUB_SIGNING_ID: ${{ secrets.PUB_SIGNING_ID }}
          PUB_SIGNING_PASSWORD: ${{ secrets.PUB_SIGNING_PASSWORD }}
          PUB_MAVEN_CENTRAL_USERNAME: ${{ secrets.PUB_MAVEN_CENTRAL_USERNAME }}
          PUB_MAVEN_CENTRAL_PASSWORD: ${{ secrets.PUB_MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishMods --no-daemon --stacktrace --console=plain
